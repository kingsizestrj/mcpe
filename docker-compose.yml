services:
  # ---------------------------------------------------------------------------
  # Servidor Minecraft Bedrock (itzg/minecraft-bedrock-server)
  # ---------------------------------------------------------------------------
  mc-bedrock:
    image: itzg/minecraft-bedrock-server
    container_name: mc_bedrock_server
    environment:
      - EULA=TRUE
      # IMPORTANTE: a maioria das configurações (gamemode, dificuldade, nome,
      # mundo, max-players, online-mode, idle-timeout, allow-list) é gerenciada
      # pelo PAINEL e persistida no server.properties. Por isso NÃO as definimos
      # aqui — senão um restart do container sobrescreveria as edições do painel.
      #
      # Seeds de inicialização (aplicados só na 1ª subida; não conflitam):
      # Lista inicial de permitidos: "Gamertag:XUID,OutroGamertag:XUID"
      - ALLOW_LIST_USERS=${ALLOW_LIST_USERS:-}
      # Operadores (admin no jogo). Formato: "Gamertag:XUID" ou só XUIDs.
      - OPS=${OPS:-}
    ports:
      # Porta externa exposta no roteador (port forward). Interna sempre 19132.
      - "${GAME_PORT:-19132}:19132/udp"
    volumes:
      - ./data:/data
    restart: unless-stopped
    # Mantém o stdin aberto para que o painel consiga enviar comandos ao console.
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # Painel Web de controle
  # ---------------------------------------------------------------------------
  panel:
    build: ./panel
    container_name: mc_bedrock_panel
    environment:
      - BEDROCK_CONTAINER=mc_bedrock_server
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-troque-esta-senha}
      - SECRET_KEY=${SECRET_KEY:-troque-esta-chave-secreta}
      - DATA_DIR=/data
      # Backups
      - BACKUP_DIR=/backups
      # Intervalo dos backups automáticos em horas (0 = desativado).
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-0}
      # Quantos backups manter (apaga os mais antigos).
      - BACKUP_KEEP=${BACKUP_KEEP:-7}
    ports:
      # Por padrão escuta só no localhost (127.0.0.1) por segurança.
      # Para acessar de outra máquina da LAN, troque por "8080:8080" no .env.
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-8080}:8080"
    volumes:
      # Acesso ao Docker para iniciar/parar/enviar comandos ao servidor.
      - /var/run/docker.sock:/var/run/docker.sock
      # Acesso aos dados do servidor (allowlist.json, server.properties, mundo).
      - ./data:/data
      # Onde os backups são gravados (fora de ./data para não se auto-incluir).
      - ./backups:/backups
    depends_on:
      - mc-bedrock
    restart: unless-stopped
